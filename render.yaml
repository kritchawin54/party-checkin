databases:
  - name: party-checkin-db
    plan: free
    databaseName: partycheckin
    user: partycheckin

services:
  - type: web
    name: party-checkin
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server.mjs
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: party-checkin-db
          property: connectionString
